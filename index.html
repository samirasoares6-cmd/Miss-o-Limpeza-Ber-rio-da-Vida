<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Limpeza: Berçário da Vida</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #cce0cc;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #gameCanvas {
            display: none;
            background: #99cc99;
            border: 3px solid #333;
            margin: 10px auto;
        }

        #startScreen,
        #gameOverScreen {
            margin-top: 100px;
        }

        .controls-panel {
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        button, select {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid #333;
        }

        #pauseBtn {
            background-color: #ffcc00;
            font-weight: bold;
        }

        label {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div id="startScreen">
    <h1>Missão Limpeza: Berçário da Vida</h1>
    
    <div style="margin-bottom: 20px;">
        <label for="difficultySelect">Dificuldade: </label>
        <select id="difficultySelect">
            <option value="facil">Fácil (Meta: 100 pts)</option>
            <option value="medio" selected>Médio (Meta: 200 pts)</option>
            <option value="dificil">Difícil (Meta: 300 pts)</option>
        </select>
    </div>

    <button id="startBtn">Iniciar Jogo</button>
</div>

<div id="gameOverScreen" style="display:none;">
    <h1 id="gameOverTitle">GAME OVER</h1>
    <p id="finalScore"></p>
    <button id="restartBtn">Jogar Novamente</button>
</div>

<div id="uiPanel" class="controls-panel" style="display:none;">
    <button id="pauseBtn">Pausar</button>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const gameOverTitle = document.getElementById("gameOverTitle");
const uiPanel = document.getElementById("uiPanel");

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");
const pauseBtn = document.getElementById("pauseBtn");
const difficultySelect = document.getElementById("difficultySelect");

const finalScore = document.getElementById("finalScore");

let score = 0;
let lives = 5;
let time = 0;
let targetScore = 200;

let difficultyConfig = {
    speedMultiplier: 1,
    spawnRate: 0.02
};

let guardian;
let trashes = [];
let nurseries = [];

let gameRunning = false;
let isPaused = false;

let gameInterval;
let timerInterval;

let audioCtx;


/* =====================================================
   CARREGAMENTO DAS IMAGENS
   ===================================================== */

const images = {};

const imageFiles = {
    // FUNDO
    fundo: "fundo_.png",

    // PERSONAGEM
    personagemParadaFrente: "personagem_parada_frente.png",
    personagemLados: "personagem_lados.png",
    personagemFrente: "personagem_frente.png",

    // ANIMAIS E ELEMENTOS A DEFENDER
    caran: "caran.png",
    galho: "galho.png",
    guara: "guara.png",

    // LIXOS
    canudo: "canudo_.png",
    papel: "papel2_.png",
    garrafa: "garrafa2_.png",
    latas: "latas_.png",
    sacola2: "sacola_2_.png",
    sacola1: "sacola_1_.png"
};

for (const nome in imageFiles) {
    images[nome] = new Image();
    images[nome].src = imageFiles[nome];

    images[nome].onerror = function () {
        console.error("ERRO AO CARREGAR IMAGEM:", imageFiles[nome]);
    };

    images[nome].onload = function () {
        console.log("Imagem carregada:", imageFiles[nome]);
    };
}


/* =====================================================
   LISTA DOS LIXOS
   ===================================================== */

const trashImages = [
    images.canudo,
    images.papel,
    images.garrafa,
    images.latas,
    images.sacola2,
    images.sacola1
];


/* =====================================================
   SOM
   ===================================================== */

function playSound(frequency, duration) {
    if (!audioCtx) return;

    try {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.type = "square";
        oscillator.frequency.value = frequency;

        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
    } catch (e) {
        console.error(e);
    }
}


/* =====================================================
   PERSONAGEM
   ===================================================== */

class Guardian {
    constructor() {
        this.baseHeight = 200;
        this.width = 160;
        this.height = 200;
        
        this.x = canvas.width / 2 - this.width / 2;
        this.groundY = canvas.height - 240;
        this.y = this.groundY;

        this.speed = 5;
        this.velocityY = 0;
        this.gravity = 0.6;
        this.jumpForce = -13;
        this.isJumping = false;
        this.facingLeft = false;

        this.currentImg = images.personagemParadaFrente;
    }

    draw() {
        let img = this.currentImg;

        if (img && img.complete && img.naturalWidth > 0) {
            let aspectRatio = img.naturalWidth / img.naturalHeight;
            this.height = this.baseHeight;
            this.width = this.baseHeight * aspectRatio;

            ctx.save();
            
            if (this.facingLeft && this.currentImg === images.personagemLados) {
                ctx.translate(this.x + this.width, this.y);
                ctx.scale(-1, 1);
                ctx.drawImage(img, 0, 0, this.width, this.height);
            } else {
                ctx.drawImage(img, this.x, this.y, this.width, this.height);
            }

            ctx.restore();
        } else {
            ctx.fillStyle = "#8b5a2b";
            ctx.fillRect(this.x, this.y, this.width, this.height);
        }
    }

    move(keys) {
        let movingLeft = keys["ArrowLeft"] || keys["a"] || keys["A"];
        let movingRight = keys["ArrowRight"] || keys["d"] || keys["D"];
        let jumpPressed = keys["ArrowUp"] || keys["w"] || keys["W"] || keys[" "];

        if (movingLeft) {
            this.x -= this.speed;
            this.facingLeft = true;
        }
        if (movingRight) {
            this.x += this.speed;
            this.facingLeft = false;
        }

        if (jumpPressed && !this.isJumping) {
            this.velocityY = this.jumpForce;
            this.isJumping = true;
            playSound(400, 0.1);
        }

        this.y += this.velocityY;
        this.velocityY += this.gravity;

        if (this.y >= this.groundY) {
            this.y = this.groundY;
            this.velocityY = 0;
            this.isJumping = false;
        }

        if (movingLeft || movingRight) {
            this.currentImg = images.personagemLados;
        } else if (this.isJumping) {
            this.currentImg = images.personagemFrente;
        } else {
            this.currentImg = images.personagemParadaFrente;
        }

        if (this.x < 0) {
            this.x = 0;
        }
        if (this.x + this.width > canvas.width) {
            this.x = canvas.width - this.width;
        }
    }
}


/* =====================================================
   LIXO
   ===================================================== */

class Trash {
    constructor(x) {
        this.x = x;
        this.y = -50;
        this.size = 45;

        this.img = trashImages[Math.floor(Math.random() * trashImages.length)];
        this.speed = (2 + (score / 100)) * difficultyConfig.speedMultiplier;
    }

    draw() {
        if (this.img && this.img.complete && this.img.naturalWidth > 0) {
            ctx.drawImage(this.img, this.x, this.y, this.size, this.size);
        } else {
            ctx.fillStyle = "#ffcc00";
            ctx.fillRect(this.x, this.y, this.size, this.size);
        }
    }

    update() {
        this.y += this.speed;
    }
}


/* =====================================================
   BERÇÁRIO
   ===================================================== */

class Nursery {
    constructor(x, image) {
        this.x = x;
        this.y = canvas.height - 80;
        this.width = 150;
        this.height = 70;
        this.image = image;
    }

    draw() {
        // Desenha apenas a imagem transparente do elemento (sem o fundo marrom e sem os textos)
        if (this.image && this.image.complete && this.image.naturalWidth > 0) {
            ctx.drawImage(this.image, this.x + 35, this.y, 80, 70);
        }
    }
}


/* =====================================================
   TECLAS
   ===================================================== */

let keys = {};

window.addEventListener("keydown", function(e) {
    keys[e.key] = true;
});

window.addEventListener("keyup", function(e) {
    keys[e.key] = false;
});


/* =====================================================
   INICIAR JOGO
   ===================================================== */

function initGame() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } else if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }

    let diff = difficultySelect.value;
    if (diff === "facil") {
        difficultyConfig = { speedMultiplier: 0.8, spawnRate: 0.015 };
        targetScore = 100;
    } else if (diff === "medio") {
        difficultyConfig = { speedMultiplier: 1.1, spawnRate: 0.025 };
        targetScore = 200;
    } else if (diff === "dificil") {
        difficultyConfig = { speedMultiplier: 1.5, spawnRate: 0.04 };
        targetScore = 300;
    }

    score = 0;
    lives = 5;
    time = 0;
    isPaused = false;
    pauseBtn.textContent = "Pausar";

    guardian = new Guardian();
    trashes = [];

    // Berçários sem texto e sem o fundo marrom
    nurseries = [
        new Nursery(70, images.caran),
        new Nursery(325, images.galho),
        new Nursery(580, images.guara)
    ];

    gameRunning = true;
    canvas.style.display = "block";
    uiPanel.style.display = "flex";
    startScreen.style.display = "none";
    gameOverScreen.style.display = "none";

    if (gameInterval) clearInterval(gameInterval);
    if (timerInterval) clearInterval(timerInterval);

    gameInterval = setInterval(gameLoop, 1000 / 60);
    timerInterval = setInterval(function() {
        if (!isPaused && gameRunning) {
            time++;
        }
    }, 1000);
}


/* =====================================================
   LOOP DO JOGO
   ===================================================== */

function gameLoop() {
    if (!gameRunning || isPaused) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // FUNDO
    if (images.fundo.complete && images.fundo.naturalWidth > 0) {
        ctx.drawImage(images.fundo, 0, 0, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = "#99cc99";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // HUD / BALÃO DE INFORMAÇÕES
    ctx.save();
    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    
    let boxX = 15;
    let boxY = 10;
    let boxWidth = 560;
    let boxHeight = 45;
    let borderRadius = 10;

    ctx.beginPath();
    ctx.roundRect(boxX, boxY, boxWidth, boxHeight, borderRadius);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px Arial";
    ctx.fillText("Pontuação: " + score + " / " + targetScore, boxX + 15, boxY + 28);
    ctx.fillText("Vidas: " + lives, boxX + 270, boxY + 28);
    ctx.fillText("Tempo: " + time + "s", boxX + 410, boxY + 28);
    ctx.restore();

    // PERSONAGEM
    guardian.move(keys);
    guardian.draw();

    // BERÇÁRIOS
    nurseries.forEach(function(n) {
        n.draw();
    });

    // CRIA LIXO
    if (Math.random() < difficultyConfig.spawnRate) {
        trashes.push(new Trash(Math.random() * (canvas.width - 45)));
    }

    // ATUALIZA OS LIXOS
    for (let i = trashes.length - 1; i >= 0; i--) {
        let t = trashes[i];
        t.update();
        t.draw();

        // COLISÃO COM PERSONAGEM
        if (
            guardian.x < t.x + t.size &&
            guardian.x + guardian.width > t.x &&
            guardian.y < t.y + t.size &&
            guardian.y + guardian.height > t.y
        ) {
            trashes.splice(i, 1);
            score += 10;
            playSound(600, 0.2);

            if (score >= targetScore) {
                endGame(true);
                return;
            }

            continue;
        }

        // COLISÃO COM BERÇÁRIOS
        let hitNursery = false;
        for (let n of nurseries) {
            if (
                t.y + t.size > n.y &&
                t.x + t.size > n.x &&
                t.x < n.x + n.width
            ) {
                hitNursery = true;
                break;
            }
        }

        if (hitNursery) {
            trashes.splice(i, 1);
            lives--;
            playSound(200, 0.3);

            if (lives <= 0) {
                endGame(false);
                return;
            }
        }
    }
}


/* =====================================================
   PAUSAR / RETOMAR
   ===================================================== */

function togglePause() {
    if (!gameRunning) return;

    isPaused = !isPaused;
    if (isPaused) {
        pauseBtn.textContent = "Continuar";
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.font = "40px Arial";
        ctx.fillText("JOGO PAUSADO", canvas.width / 2 - 140, canvas.height / 2);
    } else {
        pauseBtn.textContent = "Pausar";
    }
}


/* =====================================================
   FIM DE JOGO / VITÓRIA
   ===================================================== */

function endGame(victory = false) {
    clearInterval(gameInterval);
    clearInterval(timerInterval);
    gameRunning = false;

    canvas.style.display = "none";
    uiPanel.style.display = "none";
    gameOverScreen.style.display = "block";

    if (victory) {
        gameOverTitle.textContent = "VOCÊ VENCEU! PARABÉNS!";
        gameOverTitle.style.color = "#008000";
        finalScore.textContent = "Você atingiu a meta de " + targetScore + " pontos em " + time + " segundos!";
        playSound(800, 0.5);
    } else {
        gameOverTitle.textContent = "GAME OVER";
        gameOverTitle.style.color = "#cc0000";
        finalScore.textContent = "Pontuação final: " + score + " (Meta era " + targetScore + ")";
        playSound(100, 0.5);
    }
}


/* =====================================================
   BOTÕES E EVENTOS
   ===================================================== */

startBtn.addEventListener("click", initGame);
restartBtn.addEventListener("click", initGame);
pauseBtn.addEventListener("click", togglePause);

</script>

</body>
</html>
